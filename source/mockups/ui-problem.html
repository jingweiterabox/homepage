<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>臨床AI｜課題</title>
  <style>
    :root{--ink:#2f3639;--muted:#70787b;--line:#dfe4e5;--lime:#add735;--soft:#fbfcfc}
    *{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;background:#f4f6f4;
      color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;padding:56px 64px}
    .k{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
    .k i{width:10px;height:10px;background:var(--lime);display:inline-block}
    h1{margin:16px 0 0;font-size:44px;line-height:1.25}
    .grid{margin-top:40px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px;min-height:320px;
      box-shadow:0 10px 28px rgba(16,23,24,.05)}
    .card:nth-child(2){background:#2f3639;color:#fff;border-color:#2f3639}
    .card:nth-child(2) p{color:#d7dedf}
    .n{color:var(--lime);font-weight:800;letter-spacing:.12em;font-size:13px}
    h2{margin:18px 0 12px;font-size:26px}
    p{margin:0;font-size:16px;line-height:1.7;color:var(--muted)}
  </style>
</head>
<body>
  <div class="k"><i></i>CHALLENGE</div>
  <h1>文書が、診療の時間を奪っている</h1>
  <div class="grid">
    <article class="card"><div class="n">01</div><h2>重い文書負荷</h2><p>医師は業務時間の約30〜40%を病歴記載に費やすことがあります。画面とキーボードが、患者のための時間を圧迫します。</p></article>
    <article class="card"><div class="n">02</div><h2>属人的な記載</h2><p>表現のばらつき、根拠の確認に時間がかかり、質管理や保険適合の指摘が事後に集中しやすくなります。</p></article>
    <article class="card"><div class="n">03</div><h2>必要な転換</h2><p>「書く」から「確認する」へ。AIが下書きと根拠を整え、最終判断は医師に残します。</p></article>
  </div>
</body>
</html>
